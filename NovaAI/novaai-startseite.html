<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111936">
  <title>NovaAI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      color: #ffffff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(107, 92, 255, 0.35), transparent 32%),
        radial-gradient(circle at 85% 75%, rgba(0, 194, 255, 0.25), transparent 35%),
        linear-gradient(135deg, #080c1c 0%, #111936 52%, #101b3d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .card {
      position: relative;
      width: min(540px, 100%);
      padding: 44px 34px 38px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo-frame {
      width: 150px;
      height: 150px;
      margin: 0 auto 26px;
      padding: 8px;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.07));
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.32);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 23px;
      background: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .subtitle {
      max-width: 390px;
      margin: 18px auto 30px;
      color: #cbd5ff;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-width: 220px;
      padding: 16px 24px;
      border: 0;
      border-radius: 16px;
      color: #091027;
      background: linear-gradient(135deg, #ffffff, #dce7ff);
      box-shadow: 0 14px 35px rgba(107, 134, 255, 0.34);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .button:hover {
      transform: translateY(-3px);
      filter: brightness(1.04);
      box-shadow: 0 20px 45px rgba(107, 134, 255, 0.46);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:focus-visible {
      outline: 3px solid rgba(136, 202, 255, 0.8);
      outline-offset: 5px;
    }

    .arrow {
      font-size: 1.25rem;
      transition: transform 180ms ease;
    }

    .button:hover .arrow {
      transform: translateX(4px);
    }

    .note {
      margin: 22px 0 0;
      color: rgba(222, 229, 255, 0.62);
      font-size: 0.82rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 36px 20px 30px;
        border-radius: 24px;
      }

      .logo-frame {
        width: 126px;
        height: 126px;
        border-radius: 26px;
      }

      .logo {
        border-radius: 19px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-frame">
      <img class="logo" src="Design ohne Titel.jpg" alt="NovaAI Logo">
    </div>

    <h1>NovaAI</h1>
    <p class="subtitle">
      Starte NovaAI und entdecke die Möglichkeiten künstlicher Intelligenz.
    </p>

    <a class="button" href="https://get-novaai.base44.app/">
      Zu NovaAI
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="note">NovaAI wird nach dem Klick in diesem Fenster geöffnet.</p>
  </main>
</body>
</html>
