<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Orbinqo Maps</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--bg:#f4f6f8;--panel:rgba(255,255,255,.94);--ink:#14202b;--muted:#66727e;--accent:#2563eb;--accent2:#0ea5e9;--line:#e5e9ef;--danger:#dc2626;--shadow:0 14px 40px rgba(15,23,42,.14)}
    *{box-sizing:border-box} html,body,#app{height:100%;margin:0} body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
    button,input{font:inherit} button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:370px 1fr}.sidebar{position:relative;z-index:500;background:var(--panel);backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;box-shadow:8px 0 30px rgba(15,23,42,.07)}
    .head{padding:22px 22px 14px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand h1{font-size:21px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
    .search{display:flex;gap:8px}.searchbox{position:relative;flex:1}.searchbox svg{position:absolute;left:13px;top:12px;width:18px;color:var(--muted)}input{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 12px 0 40px;outline:none;background:#fff;transition:.2s}input:focus{border-color:#93b4ff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.primary{height:44px;border:0;border-radius:14px;padding:0 15px;color:#fff;font-weight:700;background:var(--accent);box-shadow:0 7px 18px rgba(37,99,235,.22)}.primary:hover{background:#1d4ed8}.quick{display:flex;gap:8px;margin-top:10px}.soft{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;color:#384554}.soft:hover{background:#f7f9fc}.soft:disabled{opacity:.55;cursor:wait}.route-box{margin-top:12px;padding:12px;background:#f7f9fc;border:1px solid var(--line);border-radius:16px}.route-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:9px}.route-fields{display:grid;gap:7px}.route-fields input{height:39px;padding-left:12px;border-radius:11px}.route-row{display:flex;gap:7px}.route-row select{flex:1;border:1px solid var(--line);border-radius:11px;background:white;padding:0 9px}.route-row .primary{height:39px}.route-info{display:none;margin-top:9px;padding:9px;border-radius:11px;background:#eaf1ff;color:#1e40af;font-size:12px;line-height:1.45}.route-info.on{display:block}.route-clear{border:0;background:transparent;color:var(--muted);font-size:12px}
    .section-head{padding:13px 22px 9px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}.section-head h2{font-size:14px;margin:0}.count{font-size:12px;color:var(--muted);background:#eef2f7;border-radius:999px;padding:4px 8px}.list{overflow:auto;padding:3px 12px 22px}.empty{margin:18px 10px;padding:25px 16px;border:1px dashed #ccd4dd;border-radius:16px;text-align:center;color:var(--muted);font-size:13px}.place{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0;transition:.2s}.place:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.08)}.place-top{display:flex;gap:10px}.pin{flex:0 0 34px;height:34px;border-radius:11px;background:#eaf1ff;color:var(--accent);display:grid;place-items:center}.pin svg{width:18px}.place-main{min-width:0;flex:1}.place-name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-address{font-size:12px;line-height:1.4;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{border:0;border-radius:9px;padding:7px 9px;font-size:12px}.show{background:#eef4ff;color:#1d4ed8}.remove{background:#fff1f2;color:#be123c}
    #map{height:100%;width:100%;background:#dbe6ee}.map-wrap{position:relative;min-width:0}.status{position:absolute;z-index:600;left:50%;top:18px;transform:translateX(-50%);background:rgba(17,24,39,.9);color:white;border-radius:999px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}.status.on{opacity:1}.map-tip{position:absolute;z-index:500;right:16px;bottom:24px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);border-radius:13px;padding:9px 12px;font-size:12px;color:#52606d;box-shadow:0 8px 24px rgba(15,23,42,.12)}
    .popup-card{min-width:220px}.popup-card strong{font-size:14px}.popup-card p{color:#66727e;font-size:12px;line-height:1.45}.popup-save{width:100%;border:0;border-radius:10px;padding:9px;background:#2563eb;color:white;font-weight:700}.leaflet-popup-content-wrapper{border-radius:16px;box-shadow:var(--shadow)}
    @media(max-width:760px){body{overflow:auto}.app{grid-template-columns:1fr;grid-template-rows:54vh 46vh}.map-wrap{grid-row:1}.sidebar{grid-row:2;border-right:0;border-top:1px solid var(--line)}.head{padding:12px 14px 8px}.brand{margin-bottom:10px}.brand h1{font-size:18px}.brand p{display:none}.quick{margin-top:7px}.section-head{padding:10px 14px 6px}.list{padding:2px 8px 18px}.map-tip{display:none}}
  </style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="head">
      <div class="brand"><div><h1>Orbinqo Maps</h1><p>Finden, navigieren und Orte speichern</p></div></div>
      <form id="searchForm" class="search"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="query" autocomplete="off" placeholder="Ort, Adresse oder Sehenswürdigkeit" aria-label="Ort suchen"></div><button class="primary" type="submit">Suchen</button></form>
      <div class="quick"><button id="locateBtn" class="soft" type="button">◎ Mein Standort</button><button id="homeBtn" class="soft" type="button">⌂ Startansicht</button></div><div class="route-box"><div class="route-title"><span>Routenplanung</span><button id="clearRoute" class="route-clear" type="button">Leeren</button></div><div class="route-fields"><input id="routeStart" placeholder="Startort oder Adresse"><input id="routeEnd" placeholder="Zielort oder Adresse"><div class="route-row"><select id="routeMode" aria-label="Verkehrsmittel"><option value="driving">Auto</option><option value="cycling">Fahrrad</option><option value="walking">Zu Fuß</option></select><button id="routeBtn" class="primary" type="button">Route</button></div></div><div id="routeInfo" class="route-info"></div></div>
    </div>
    <div class="section-head"><h2>Gespeicherte Orte</h2><span id="count" class="count">0</span></div>
    <div id="savedList" class="list"></div>
  </aside>
  <main class="map-wrap"><div id="map"></div><div id="status" class="status" role="status"></div><div class="map-tip">Tipp: Klicke auf die Karte, um einen Punkt zu speichern.</div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
  'use strict';
  const START = [48.678, 9.218], ZOOM = 12, KEY = 'meine-orte-v1';
  const map = L.map('map', {zoomControl:true}).setView(START, ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'}).addTo(map);
  const resultLayer = L.layerGroup().addTo(map), savedLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
  let saved = load();
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function load(){ try{return JSON.parse(localStorage.getItem(KEY)) || []}catch{return []} }
  function persist(){ localStorage.setItem(KEY, JSON.stringify(saved)); renderSaved(); }
  function notify(msg, ms=2300){ const e=$('#status'); e.textContent=msg;e.classList.add('on');clearTimeout(notify.t);notify.t=setTimeout(()=>e.classList.remove('on'),ms); }
  function icon(color='#2563eb'){return L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:3px solid white;box-shadow:0 3px 9px #0004"><div style="width:7px;height:7px;border-radius:50%;background:white;margin:7px"></div></div>`,iconSize:[28,28],iconAnchor:[14,28]});}
  function popup(place, canSave=true){return `<div class="popup-card"><strong>${esc(place.name)}</strong><p>${esc(place.address || `${place.lat.toFixed(5)}, ${place.lon.toFixed(5)}`)}</p>${canSave?`<button class="popup-save" data-save='${encodeURIComponent(JSON.stringify(place))}'>Ort speichern</button>`:''}</div>`;}
  function showPlace(place, saveButton=true){ resultLayer.clearLayers(); const m=L.marker([place.lat,place.lon],{icon:icon()}).addTo(resultLayer).bindPopup(popup(place,saveButton)).openPopup(); map.flyTo([place.lat,place.lon], Math.max(map.getZoom(),15), {duration:.8}); return m; }
  function savePlace(place){ if(saved.some(x => Math.abs(x.lat-place.lat)<1e-6 && Math.abs(x.lon-place.lon)<1e-6)){notify('Dieser Ort ist bereits gespeichert.');return;} saved.unshift({...place,id:Date.now()});persist();notify('Ort gespeichert.'); }
  function renderSaved(){ savedLayer.clearLayers(); $('#count').textContent=saved.length; const list=$('#savedList'); if(!saved.length){list.innerHTML='<div class="empty">Noch keine Orte gespeichert.<br>Suche einen Ort oder klicke auf die Karte.</div>';return;} list.innerHTML=saved.map(p=>`<article class="place"><div class="place-top"><div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/></svg></div><div class="place-main"><div class="place-name">${esc(p.name)}</div><div class="place-address">${esc(p.address||'Eigener Kartenpunkt')}</div><div class="actions"><button class="show" data-show="${p.id}">Auf Karte</button><button class="remove" data-remove="${p.id}">Entfernen</button></div></div></div></article>`).join(''); saved.forEach(p=>L.marker([p.lat,p.lon],{icon:icon('#f97316')}).addTo(savedLayer).bindPopup(popup(p,false))); }
  async function search(q){ notify('Suche läuft …',10000); try{ const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q='+encodeURIComponent(q); const r=await fetch(url,{headers:{'Accept-Language':'de'}}); if(!r.ok) throw new Error(); const data=await r.json(); if(!data.length){notify('Kein passender Ort gefunden.');return;} const places=data.map(x=>({name:(x.namedetails&&x.namedetails.name)||x.name||x.display_name.split(',')[0],address:x.display_name,lat:+x.lat,lon:+x.lon})); resultLayer.clearLayers(); const bounds=[]; places.forEach(p=>{L.marker([p.lat,p.lon],{icon:icon()}).addTo(resultLayer).bindPopup(popup(p,true));bounds.push([p.lat,p.lon]);}); if(places.length===1) showPlace(places[0]); else map.fitBounds(bounds,{padding:[45,45],maxZoom:15}); notify(`${places.length} Treffer gefunden.`); }catch(e){notify('Suche nicht erreichbar. Bitte Internetverbindung prüfen.',4000);} }
  async function reverse(lat,lon){ try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18`,{headers:{'Accept-Language':'de'}});const x=await r.json();return {name:x.name||x.display_name?.split(',')[0]||'Gesetzter Punkt',address:x.display_name||'',lat,lon};}catch{return {name:'Gesetzter Punkt',address:'',lat,lon};} }
  async function geocodeOne(q){const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{'Accept-Language':'de'}});if(!r.ok)throw new Error('Geocoding');const d=await r.json();if(!d.length)throw new Error('Nicht gefunden: '+q);return {name:d[0].display_name.split(',')[0],address:d[0].display_name,lat:+d[0].lat,lon:+d[0].lon};}
  function fmtDistance(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1).replace('.',',')+' km':Math.round(m)+' m';}
  function fmtDuration(sec){const min=Math.round(sec/60);if(min<60)return min+' Min.';const h=Math.floor(min/60),rest=min%60;return h+' Std. '+(rest?rest+' Min.':'');}
  async function calculateRoute(){const startQ=$('#routeStart').value.trim(),endQ=$('#routeEnd').value.trim(),mode=$('#routeMode').value,btn=$('#routeBtn');if(!startQ||!endQ){notify('Bitte Start und Ziel eingeben.');return;}btn.disabled=true;btn.textContent='Berechne …';notify('Route wird berechnet …',15000);try{const [a,b]=await Promise.all([geocodeOne(startQ),geocodeOne(endQ)]);const url=`https://router.project-osrm.org/route/v1/${mode}/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson&steps=false`;const r=await fetch(url);if(!r.ok)throw new Error('Routing');const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)throw new Error('Keine Route');const route=d.routes[0];routeLayer.clearLayers();const line=L.geoJSON(route.geometry,{style:{color:'#2563eb',weight:6,opacity:.85}}).addTo(routeLayer);L.marker([a.lat,a.lon],{icon:icon('#16a34a')}).addTo(routeLayer).bindPopup('<b>Start</b><br>'+esc(a.address));L.marker([b.lat,b.lon],{icon:icon('#dc2626')}).addTo(routeLayer).bindPopup('<b>Ziel</b><br>'+esc(b.address));map.fitBounds(line.getBounds(),{padding:[35,35]});const labels={driving:'Auto',cycling:'Fahrrad',walking:'Zu Fuß'};$('#routeInfo').innerHTML=`<b>${labels[mode]}</b>: ${fmtDistance(route.distance)} · ca. ${fmtDuration(route.duration)}<br><span>${esc(a.name)} → ${esc(b.name)}</span>`;$('#routeInfo').classList.add('on');notify('Route wurde berechnet.');}catch(e){notify(e.message.startsWith('Nicht')?e.message:'Route konnte nicht berechnet werden.',4000);}finally{btn.disabled=false;btn.textContent='Route';}}

  $('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#query').value.trim();if(q)search(q);});
  $('#homeBtn').onclick=()=>map.flyTo(START,ZOOM);
  $('#routeBtn').onclick=calculateRoute;
  $('#routeStart').addEventListener('keydown',e=>{if(e.key==='Enter')calculateRoute();});
  $('#routeEnd').addEventListener('keydown',e=>{if(e.key==='Enter')calculateRoute();});
  $('#clearRoute').onclick=()=>{routeLayer.clearLayers();$('#routeStart').value='';$('#routeEnd').value='';$('#routeInfo').classList.remove('on');notify('Route entfernt.');};
  $('#locateBtn').onclick=()=>{const b=$('#locateBtn');if(!navigator.geolocation){notify('Standortfunktion wird nicht unterstützt.');return;}b.disabled=true;b.textContent='Standort wird ermittelt …';navigator.geolocation.getCurrentPosition(pos=>{b.disabled=false;b.textContent='◎ Mein Standort';const p={name:'Mein Standort',address:'Aktuelle Position',lat:pos.coords.latitude,lon:pos.coords.longitude};showPlace(p,true);},()=>{b.disabled=false;b.textContent='◎ Mein Standort';notify('Standort konnte nicht ermittelt werden.',3500);},{enableHighAccuracy:true,timeout:10000});};
  map.on('click',async e=>{notify('Adresse wird ermittelt …',7000);const p=await reverse(e.latlng.lat,e.latlng.lng);showPlace(p,true);notify('Punkt ausgewählt.');});
  document.addEventListener('click',e=>{const s=e.target.closest('[data-save]');if(s){try{savePlace(JSON.parse(decodeURIComponent(s.dataset.save)));map.closePopup();}catch{}}const sh=e.target.closest('[data-show]');if(sh){const p=saved.find(x=>x.id==sh.dataset.show);if(p){map.flyTo([p.lat,p.lon],16);L.popup().setLatLng([p.lat,p.lon]).setContent(popup(p,false)).openOn(map);}}const rm=e.target.closest('[data-remove]');if(rm){saved=saved.filter(x=>x.id!=rm.dataset.remove);persist();notify('Ort entfernt.');}});
  renderSaved(); setTimeout(()=>map.invalidateSize(),100);
})();
</script>
</body>
</html>
