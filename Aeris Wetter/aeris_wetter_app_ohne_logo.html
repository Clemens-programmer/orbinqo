<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1630">
<title>Aeris Wetter</title>
<style>
:root{--bg:#071225;--panel:rgba(14,29,55,.72);--panel2:rgba(255,255,255,.09);--text:#f5f8ff;--muted:#aebbd2;--accent:#65c7ff;--accent2:#7b8cff;--good:#73e6b1;--line:rgba(255,255,255,.12);--shadow:0 24px 65px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,#173d6a 0,transparent 35%),radial-gradient(circle at 86% 20%,#283d87 0,transparent 30%),linear-gradient(150deg,#06101f,#0b1730 55%,#101735);overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.32;pointer-events:none}.orb.a{width:360px;height:360px;background:#1db7ff;right:-120px;top:30%}.orb.b{width:300px;height:300px;background:#765cff;left:-110px;bottom:-80px}.app{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 42px}.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.4px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#5dd7ff,#6673ff);box-shadow:0 12px 30px rgba(73,137,255,.35);font-size:22px}.searchwrap{position:relative;width:min(540px,60%)}.search{display:flex;align-items:center;gap:10px;padding:6px 7px 6px 15px;background:rgba(5,14,31,.58);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;font:inherit;padding:9px 0}.search button,.iconbtn{border:0;color:#fff;background:linear-gradient(135deg,#4bc7ff,#6978ff);border-radius:13px;padding:10px 14px;cursor:pointer;font-weight:700;transition:.2s}.search button:hover,.iconbtn:hover{transform:translateY(-1px);filter:brightness(1.08)}.suggestions{display:none;position:absolute;z-index:20;left:0;right:0;top:58px;background:#101e38;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}.suggestions.show{display:block}.suggestion{padding:11px 12px;border-radius:11px;cursor:pointer}.suggestion:hover{background:rgba(255,255,255,.08)}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:27px;backdrop-filter:blur(22px);box-shadow:var(--shadow)}.hero{position:relative;overflow:hidden;padding:30px;min-height:390px}.hero:after{content:"";position:absolute;width:310px;height:310px;border-radius:50%;right:-125px;top:-145px;background:radial-gradient(circle,#72c9ff55,transparent 68%)}.eyebrow{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;font-weight:700}.location{font-size:clamp(24px,3vw,38px);font-weight:800;letter-spacing:-1.5px;margin:4px 0}.updated{color:var(--muted);font-size:13px}.current{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:28px 0}.temperature{font-size:clamp(68px,10vw,112px);font-weight:800;letter-spacing:-7px;line-height:.85}.weathericon{font-size:90px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.22))}.condition{font-size:20px;font-weight:700;margin-top:14px}.feels{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:17px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:17px}.side{padding:25px;display:flex;flex-direction:column}.side h2,.section h2{font-size:18px;margin:0 0 18px}.sunrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:18px;padding:15px;margin-bottom:12px}.sunrow div:last-child{text-align:right}.sunrow span{display:block;color:var(--muted);font-size:12px}.sunrow strong{font-size:18px}.details{margin-top:auto;display:grid;gap:12px}.detail{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--muted)}.detail b{color:var(--text)}.section{padding:24px;margin-top:18px}.hourly{display:flex;gap:10px;overflow:auto;padding:3px 1px 10px;scrollbar-color:#ffffff33 transparent}.hour{min-width:84px;text-align:center;padding:13px 8px;border-radius:18px;background:var(--panel2);border:1px solid transparent}.hour.now{border-color:#65c7ff;background:rgba(79,181,255,.15)}.hour .ico{font-size:27px;margin:7px 0}.hour small{display:block;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{padding:16px 12px;text-align:center;border-radius:19px;background:var(--panel2)}.day .ico{font-size:32px;margin:8px 0}.day small{color:var(--muted)}.temps{display:flex;justify-content:center;gap:8px}.temps span:last-child{color:var(--muted)}.status{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 17px;background:#111f38;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transform:translateY(120px);transition:.3s}.status.show{transform:none}.loader{display:none;width:18px;height:18px;border:2px solid #ffffff44;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}.loading .loader{display:block}.loading #searchText{display:none}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.topbar{align-items:stretch;flex-direction:column}.searchwrap{width:100%}.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,1fr)}.hero{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.app{width:min(100% - 18px,1180px);padding-top:14px}.days{grid-template-columns:repeat(2,1fr)}.current{align-items:flex-start}.weathericon{font-size:66px}.temperature{font-size:72px}.card{border-radius:22px}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="app">
<header class="topbar">
  <div class="brand">Aeris Wetter</div>
  <div class="searchwrap">
    <form class="search" id="searchForm"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Stadt oder Postleitzahl suchen…"><button id="searchBtn"><span id="searchText">Suchen</span><span class="loader"></span></button><button type="button" class="iconbtn" id="locateBtn" title="Meinen Standort verwenden">⌖</button></form>
    <div class="suggestions" id="suggestions"></div>
  </div>
</header>
<section class="grid">
 <article class="card hero">
  <div class="eyebrow">Aktuelles Wetter</div><h1 class="location" id="location">Wetter wird geladen…</h1><div class="updated" id="updated">Bitte einen Moment</div>
  <div class="current"><div><div class="temperature"><span id="temp">--</span><sup style="font-size:.32em;letter-spacing:0">°</sup></div><div class="condition" id="condition">--</div><div class="feels">Gefühlt <span id="feels">--</span>°C</div></div><div class="weathericon" id="weatherIcon">⛅</div></div>
  <div class="stats"><div class="stat"><span>Wind</span><strong id="wind">--</strong></div><div class="stat"><span>Luftfeuchte</span><strong id="humidity">--</strong></div><div class="stat"><span>Niederschlag</span><strong id="rain">--</strong></div><div class="stat"><span>UV-Index</span><strong id="uv">--</strong></div></div>
 </article>
 <aside class="card side"><h2>Sonne & Details</h2><div class="sunrow"><div><span>Sonnenaufgang</span><strong id="sunrise">--:--</strong></div><div style="font-size:28px">🌅</div></div><div class="sunrow"><div style="font-size:28px">🌇</div><div><span>Sonnenuntergang</span><strong id="sunset">--:--</strong></div></div><div class="details"><div class="detail">Luftdruck <b id="pressure">--</b></div><div class="detail">Sichtweite <b id="visibility">--</b></div><div class="detail">Windböen <b id="gust">--</b></div><div class="detail">Zeitzone <b id="timezone">--</b></div></div></aside>
</section>
<section class="card section"><h2>Die nächsten 24 Stunden</h2><div class="hourly" id="hourly"></div></section>
<section class="card section"><h2>7-Tage-Vorhersage</h2><div class="days" id="days"></div></section>
</main><div class="status" id="status"></div>
<script>
const $=s=>document.querySelector(s); let searchTimer;
const codes={0:['Klar','☀️'],1:['Überwiegend klar','🌤️'],2:['Teilweise bewölkt','⛅'],3:['Bedeckt','☁️'],45:['Nebel','🌫️'],48:['Reifnebel','🌫️'],51:['Leichter Nieselregen','🌦️'],53:['Nieselregen','🌦️'],55:['Starker Nieselregen','🌧️'],56:['Gefrierender Nieselregen','🌧️'],57:['Starker gefrierender Nieselregen','🌧️'],61:['Leichter Regen','🌦️'],63:['Regen','🌧️'],65:['Starker Regen','🌧️'],66:['Gefrierender Regen','🌧️'],67:['Starker gefrierender Regen','🌧️'],71:['Leichter Schneefall','🌨️'],73:['Schneefall','🌨️'],75:['Starker Schneefall','❄️'],77:['Schneegriesel','🌨️'],80:['Leichte Schauer','🌦️'],81:['Regenschauer','🌧️'],82:['Starke Regenschauer','⛈️'],85:['Schneeschauer','🌨️'],86:['Starke Schneeschauer','❄️'],95:['Gewitter','⛈️'],96:['Gewitter mit Hagel','⛈️'],99:['Starkes Gewitter mit Hagel','⛈️']};
const wx=c=>codes[c]||['Unbekannt','🌡️']; const time=v=>new Date(v).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); const day=v=>new Date(v+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'});
function toast(t){$('#status').textContent=t;$('#status').classList.add('show');setTimeout(()=>$('#status').classList.remove('show'),3200)}
async function getWeather(lat,lon,name){
 try{$('#searchBtn').classList.add('loading');
 const params=new URLSearchParams({latitude:lat,longitude:lon,timezone:'auto',forecast_days:7,current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_gusts_10m',hourly:'temperature_2m,apparent_temperature,precipitation_probability,weather_code,visibility',daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,wind_speed_10m_max'});
 const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params); if(!r.ok)throw new Error(); const d=await r.json(); render(d,name); localStorage.setItem('aerisLocation',JSON.stringify({lat,lon,name}));
 }catch(e){toast('Wetterdaten konnten nicht geladen werden. Internetverbindung prüfen.')}finally{$('#searchBtn').classList.remove('loading')}}
function render(d,name){const c=d.current,di=d.daily,h=d.hourly,w=wx(c.weather_code);$('#location').textContent=name;$('#updated').textContent='Aktualisiert '+time(c.time)+' · aktuelle Prognosedaten';$('#temp').textContent=Math.round(c.temperature_2m);$('#condition').textContent=w[0];$('#weatherIcon').textContent=w[1];$('#feels').textContent=Math.round(c.apparent_temperature);$('#wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('#humidity').textContent=c.relative_humidity_2m+' %';$('#rain').textContent=c.precipitation.toFixed(1)+' mm';$('#uv').textContent=di.uv_index_max[0].toFixed(1);$('#sunrise').textContent=time(di.sunrise[0]);$('#sunset').textContent=time(di.sunset[0]);$('#pressure').textContent=Math.round(c.surface_pressure)+' hPa';let ix=h.time.findIndex(x=>x>=c.time);if(ix<0)ix=0;$('#visibility').textContent=((h.visibility[ix]||0)/1000).toFixed(1)+' km';$('#gust').textContent=Math.round(c.wind_gusts_10m)+' km/h';$('#timezone').textContent=d.timezone_abbreviation;
 $('#hourly').innerHTML=h.time.slice(ix,ix+24).map((t,i)=>{let n=ix+i;return `<div class="hour ${i===0?'now':''}"><b>${i===0?'Jetzt':time(t)}</b><div class="ico">${wx(h.weather_code[n])[1]}</div><strong>${Math.round(h.temperature_2m[n])}°</strong><small>💧 ${h.precipitation_probability[n]}%</small></div>`}).join('');
 $('#days').innerHTML=di.time.map((t,i)=>`<div class="day"><b>${i===0?'Heute':day(t)}</b><div class="ico">${wx(di.weather_code[i])[1]}</div><div class="temps"><span>${Math.round(di.temperature_2m_max[i])}°</span><span>${Math.round(di.temperature_2m_min[i])}°</span></div><small>💧 ${di.precipitation_probability_max[i]}%</small></div>`).join('')}
async function geocode(q,showList=false){if(q.trim().length<2)return [];try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=de&format=json`);const d=await r.json();const a=d.results||[];if(showList){$('#suggestions').innerHTML=a.map((x,i)=>`<div class="suggestion" data-i="${i}"><b>${x.name}</b><br><small>${[x.admin1,x.country].filter(Boolean).join(', ')}</small></div>`).join('')||'<div class="suggestion">Kein Ort gefunden</div>';$('#suggestions').classList.add('show');[...document.querySelectorAll('[data-i]')].forEach(el=>el.onclick=()=>pick(a[el.dataset.i]))}return a}catch{return []}}
function pick(x){$('#searchInput').value=x.name;$('#suggestions').classList.remove('show');getWeather(x.latitude,x.longitude,[x.name,x.admin1,x.country].filter(Boolean).join(', '))}
$('#searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>geocode(e.target.value,true),280)});$('#searchForm').onsubmit=async e=>{e.preventDefault();let a=await geocode($('#searchInput').value);if(a[0])pick(a[0]);else toast('Ort nicht gefunden.')};document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('#suggestions').classList.remove('show')});
$('#locateBtn').onclick=()=>{if(!navigator.geolocation)return toast('Ortung wird nicht unterstützt.');toast('Standort wird ermittelt…');navigator.geolocation.getCurrentPosition(p=>getWeather(p.coords.latitude,p.coords.longitude,'Mein Standort'),()=>toast('Standortzugriff nicht möglich.'),{enableHighAccuracy:true,timeout:10000})};
const saved=JSON.parse(localStorage.getItem('aerisLocation')||'null'); saved?getWeather(saved.lat,saved.lon,saved.name):getWeather(48.678,9.218,'Filderstadt, Baden-Württemberg, Deutschland');
</script>
</body></html>
