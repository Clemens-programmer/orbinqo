<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Clean Pro</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1b1b22, #0b0b10);
    font-family: system-ui, Arial;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 16px 0 4px;
    font-size: 22px;
    letter-spacing: 1px;
  }

  canvas {
    margin-top: 10px;
    background: #050507;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  .hud {
    margin-top: 10px;
    opacity: 0.85;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    backdrop-filter: blur(6px);
  }

  .card {
    background: rgba(20,20,30,0.9);
    padding: 22px 28px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }

  button {
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    background: #4ade80;
    color: black;
    font-weight: bold;
  }

  button:hover {
    background: #22c55e;
  }
</style>
</head>

<body>

<h1>🐍 Snake</h1>
<canvas id="c" width="420" height="420"></canvas>
<div class="hud">Punkte: <span id="score">0</span></div>

<div id="menu" class="overlay">
  <div class="card">
    <h2>Snake</h2>
    <p>Pfeiltasten steuern<br>Friss die Punkte 🍎</p>
    <button onclick="start()">Start</button>
  </div>
</div>

<div id="gameover" class="overlay" style="display:none;">
  <div class="card">
    <h2>Game Over</h2>
    <p id="final"></p>
    <button onclick="start()">Nochmal</button>
  </div>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const menu = document.getElementById("menu");
const gameover = document.getElementById("gameover");
const final = document.getElementById("final");

const grid = 20;
const size = canvas.width / grid;

let snake, dir, food, score, running;
let lastTime = 0;
let speed = 7; // steps per second
let acc = 0;

let nextDir = {x: 1, y: 0};

document.addEventListener("keydown", e => {
  if (!running) return;

  if (e.key === "ArrowUp" && dir.y === 0) nextDir = {x: 0, y: -1};
  if (e.key === "ArrowDown" && dir.y === 0) nextDir = {x: 0, y: 1};
  if (e.key === "ArrowLeft" && dir.x === 0) nextDir = {x: -1, y: 0};
  if (e.key === "ArrowRight" && dir.x === 0) nextDir = {x: 1, y: 0};
});

function start() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  food = spawn();
  score = 0;
  speed = 7;
  running = true;

  menu.style.display = "none";
  gameover.style.display = "none";

  scoreEl.textContent = "0";
}

function spawn() {
  return {
    x: Math.floor(Math.random() * size),
    y: Math.floor(Math.random() * size)
  };
}

function update() {
  dir = nextDir;

  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // wall
  if (head.x < 0 || head.y < 0 || head.x >= size || head.y >= size) {
    return die();
  }

  // self collision
  for (let p of snake) {
    if (p.x === head.x && p.y === head.y) return die();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    food = spawn();

    // difficulty scaling (sanft)
    speed = Math.min(14, 7 + score * 0.3);
    scoreEl.textContent = score;
  } else {
    snake.pop();
  }
}

function die() {
  running = false;
  final.textContent = "Punkte: " + score;
  gameover.style.display = "flex";
}

function draw() {
  ctx.fillStyle = "#050507";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = "#ff3b3b";
  ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

  // snake
  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? "#7CFF6B" : "#2ecc71";
    ctx.fillRect(
      snake[i].x * grid,
      snake[i].y * grid,
      grid - 2,
      grid - 2
    );
  }
}

function loop(t) {
  requestAnimationFrame(loop);

  if (!running) return;

  if (!lastTime) lastTime = t;
  acc += (t - lastTime) / 1000;
  lastTime = t;

  const stepTime = 1 / speed;

  while (acc > stepTime) {
    update();
    acc -= stepTime;
  }

  draw();
}

requestAnimationFrame(loop);
</script>

</body>
</html>
