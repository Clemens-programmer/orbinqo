<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10172a">
<title>Orbinqo</title>
<style>
:root{--accent:#7188ff;--accent2:#925cff;--text:#f8faff;--muted:#b7c1d9;--glass:rgba(8,14,29,.72);--border:rgba(255,255,255,.14);--task:72px}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#07101f;user-select:none}button,input{font:inherit}.desktop{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 18%,#4264df88,transparent 32%),radial-gradient(circle at 83% 20%,#8b3fcf77,transparent 31%),linear-gradient(145deg,#071020,#172554 48%,#171133);background-size:cover;background-position:center}.desktop:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(4,8,18,.05),rgba(4,8,18,.24));z-index:0}.brand{position:absolute;left:24px;top:20px;z-index:2;display:flex;align-items:center;gap:11px;padding:7px 12px 7px 7px;border:1px solid var(--border);border-radius:17px;background:rgba(7,13,27,.35);backdrop-filter:blur(16px)}.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover;display:none}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.top-info{position:absolute;top:24px;right:26px;z-index:2;text-align:right;text-shadow:0 2px 15px #0008}.time{font-size:clamp(30px,4vw,52px);font-weight:650;letter-spacing:-2px}.date{font-size:13px;color:var(--muted)}.desktop-icons{position:absolute;z-index:3;inset:88px 18px calc(var(--task) + 25px);display:grid;grid-template-columns:repeat(auto-fill,92px);grid-auto-rows:104px;gap:10px;align-content:start}.desktop-icon{width:92px;height:100px;border:0;color:white;background:transparent;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:grab;transition:.16s}.desktop-icon:hover,.desktop-icon.dragging{background:#ffffff18;outline:1px solid #ffffff20}.desktop-icon.dragging{opacity:.45}.app-symbol{width:54px;height:54px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 24px #0005,inset 0 1px #fff5}.app-symbol img,.title-icon img,.task-btn img{width:100%;height:100%;object-fit:cover;display:block}.label{max-width:86px;font-size:12px;line-height:1.15;text-align:center;text-shadow:0 2px 8px #000;overflow-wrap:anywhere}.taskbar{position:absolute;z-index:5000;left:50%;bottom:11px;transform:translateX(-50%);height:var(--task);width:min(780px,calc(100% - 22px));padding:10px 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:22px;background:rgba(7,13,27,.63);backdrop-filter:blur(25px);box-shadow:0 18px 45px #0006}.task-btn{flex:0 0 auto;width:50px;height:50px;border:0;border-radius:15px;color:white;background:#ffffff0e;display:grid;place-items:center;font-size:22px;cursor:pointer;position:relative}.task-btn:hover{background:#ffffff20}.start-btn{background:linear-gradient(145deg,var(--accent),var(--accent2));font-weight:800}.task-divider{width:1px;height:36px;background:var(--border)}.running-apps{display:flex;gap:7px;min-width:0;overflow:auto;scrollbar-width:none}.running-app.active:after{content:"";position:absolute;bottom:4px;width:18px;height:3px;border-radius:5px;background:#a9b7ff}.tray{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.tray-clock{text-align:right;color:white}.start-menu,.panel{position:absolute;z-index:6000;border:1px solid var(--border);background:rgba(7,13,27,.88);backdrop-filter:blur(28px);box-shadow:0 25px 70px #0008}.start-menu{left:50%;bottom:93px;transform:translateX(-50%) translateY(14px) scale(.98);width:min(590px,calc(100% - 24px));max-height:calc(100% - 118px);padding:18px;border-radius:25px;opacity:0;pointer-events:none;transition:.18s;overflow:auto}.start-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}.search{width:100%;border:1px solid var(--border);padding:13px 15px;border-radius:14px;background:#ffffff0d;color:white;outline:none;user-select:text}.section-title{margin:17px 3px 9px;color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.menu-app{border:0;color:white;background:transparent;border-radius:15px;padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}.menu-app:hover{background:#ffffff14}.menu-app .app-symbol{width:46px;height:46px;font-size:23px}.menu-app span:last-child{font-size:12px;text-align:center}.menu-footer{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.window{position:absolute;z-index:100;left:50%;top:46%;transform:translate(-50%,-50%) scale(.97);width:min(1040px,84vw);height:min(720px,78vh);min-width:320px;min-height:230px;border:1px solid #ffffff22;border-radius:20px;overflow:hidden;background:#f8fafc;box-shadow:0 25px 75px #0009;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s}.window.visible{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.window.minimized{display:none}.window.maximized{left:8px!important;top:8px!important;transform:none!important;width:calc(100% - 16px)!important;height:calc(100% - var(--task) - 29px)!important}.titlebar{height:52px;padding:0 10px 0 14px;display:flex;align-items:center;gap:10px;background:#091022;color:white;cursor:move}.title-icon{width:31px;height:31px;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2))}.title-text{font-weight:650;font-size:14px}.win-controls{margin-left:auto;display:flex;gap:4px}.win-btn{width:38px;height:34px;border:0;border-radius:9px;color:white;background:transparent;cursor:pointer}.win-btn:hover{background:#ffffff17}.win-btn.close:hover{background:#e5484d}.app-frame,.native-app{display:block;width:100%;height:calc(100% - 52px);border:0;background:#f4f7fc}.native-app{overflow:auto;color:#142039;user-select:text}.native-wrap{max-width:920px;margin:auto;padding:28px}.hero-card{padding:25px;border-radius:22px;color:white;background:linear-gradient(135deg,#526ce5,#813fd2);box-shadow:0 18px 45px #5369d744}.hero-card h1{margin:0 0 7px;font-size:30px}.store-tools{display:flex;gap:10px;margin:20px 0}.store-tools input{flex:1;padding:12px 14px;border:1px solid #d7ddea;border-radius:13px;background:white}.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.store-card,.setting-card{background:white;border:1px solid #dde3ef;border-radius:18px;padding:16px;box-shadow:0 8px 25px #45526a12}.store-head{display:flex;gap:12px;align-items:center}.store-head .app-symbol{flex:0 0 52px}.store-card h3{margin:0 0 3px}.store-card p{font-size:13px;color:#667085;min-height:36px}.primary,.secondary{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#596fe5;color:white}.primary.installed{background:#e9edf8;color:#4e5a70}.secondary{background:#e9edf8;color:#344054}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;margin-top:20px}.setting-card h3{margin:0 0 7px}.setting-card p{font-size:13px;color:#667085}.setting-actions{display:flex;gap:8px;flex-wrap:wrap}.setting-card input[type="url"]{width:100%;padding:10px;border:1px solid #d7ddea;border-radius:10px;margin:8px 0}.wallpapers{display:flex;gap:8px;flex-wrap:wrap}.wallpaper{width:70px;height:45px;border:2px solid transparent;border-radius:10px;cursor:pointer;background-size:cover;background-position:center}.wallpaper.active{border-color:#596fe5}.toast{position:absolute;z-index:9000;top:20px;left:50%;transform:translate(-50%,-15px);padding:12px 16px;border:1px solid var(--border);border-radius:13px;background:#091022ee;box-shadow:0 15px 40px #0006;opacity:0;pointer-events:none;transition:.2s;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){:root{--task:62px}.brand{top:13px;left:12px}.brand small{display:none}.top-info{top:18px;right:14px}.desktop-icons{inset:78px 7px 78px;grid-template-columns:repeat(4,1fr);grid-auto-rows:94px;gap:3px}.desktop-icon{width:100%;height:92px}.app-symbol{width:49px;height:49px}.taskbar{bottom:7px;height:62px;padding:7px 8px}.task-btn{width:46px;height:46px}.tray .status{display:none}.start-grid{grid-template-columns:repeat(3,1fr)}.window,.window.visible{left:5px!important;top:5px!important;transform:none!important;width:calc(100% - 10px)!important;height:calc(100% - var(--task) - 17px)!important;border-radius:14px}.titlebar{cursor:default}.native-wrap{padding:17px}.store-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="desktop" id="desktop">
  <div class="brand"><img id="mainLogo" alt="Orbinqo Logo"><div><b>Orbinqo</b><small>Dein Web-Desktop</small></div></div>
  <div class="top-info"><div class="time" id="heroTime">--:--</div><div class="date" id="heroDate">---</div></div>
  <section class="desktop-icons" id="desktopIcons" aria-label="Installierte Apps"></section>
  <section class="start-menu" id="startMenu"><input class="search" id="appSearch" placeholder="Installierte Apps suchen …"><div class="section-title">Installierte Apps</div><div class="start-grid" id="startGrid"></div><div class="menu-footer"><span>Orbinqo</span><span id="appStatus">Apps werden geladen …</span></div></section>
  <div id="windows"></div>
  <nav class="taskbar"><button class="task-btn start-btn" id="startButton" title="Start">◆</button><div class="task-divider"></div><div class="running-apps" id="runningApps"></div><div class="tray"><span class="status">● Online</span><div class="tray-clock"><div id="trayTime">--:--</div><div id="trayDate">--.--.----</div></div></div></nav>
  <div class="toast" id="toast"></div>
</main>
<script>
const OWNER='clemens-programmer',REPO='orbinqo',BRANCH='main';
const BASE='https://clemens-programmer.github.io/orbinqo/';
const TREE_API=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
const KEY={installed:'orbinqo.installed',order:'orbinqo.order',wallpaper:'orbinqo.wallpaper',location:'orbinqo.location'};
const BUILTINS=[
 {id:'store',name:'Orbinqo Store',icon:'🛍️',type:'store',color1:'#555ee8',color2:'#9b4ddb',description:'Apps entdecken, suchen und installieren.'},
 {id:'settings',name:'Einstellungen',icon:'⚙️',type:'settings',color1:'#64748b',color2:'#334155',description:'Hintergrund, Standort und Orbinqo anpassen.'}
];
let catalog=[...BUILTINS],topZ=100,toastTimer,mainIcon='';
const $=s=>document.querySelector(s),desktop=$('#desktop'),desktopIcons=$('#desktopIcons'),startGrid=$('#startGrid'),windows=$('#windows'),runningApps=$('#runningApps'),startMenu=$('#startMenu'),startButton=$('#startButton'),appSearch=$('#appSearch'),appStatus=$('#appStatus'),toast=$('#toast');
const load=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const appVars=a=>`--c1:${a.color1||'#64748b'};--c2:${a.color2||'#334155'}`;
const iconMarkup=a=>a.iconUrl?`<img src="${esc(a.iconUrl)}" alt="">`:(a.icon||'◻');
const encodePath=p=>p.split('/').map(encodeURIComponent).join('/');
const appById=id=>catalog.find(a=>a.id===id);
function installedIds(){const saved=load(KEY.installed,null);return saved||BUILTINS.map(a=>a.id)}
function orderedInstalled(){const ids=installedIds(),order=load(KEY.order,[]),all=[...new Set([...order,...ids])].filter(id=>ids.includes(id));return all.map(appById).filter(Boolean)}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2500)}
function renderApps(filter=''){
 const apps=orderedInstalled().filter(a=>a.name.toLowerCase().includes(filter.toLowerCase()));
 desktopIcons.innerHTML=apps.map(a=>`<button class="desktop-icon" draggable="true" data-id="${esc(a.id)}" data-open="${esc(a.id)}"><span class="app-symbol" style="${appVars(a)}">${iconMarkup(a)}</span><span class="label">${esc(a.name)}</span></button>`).join('');
 startGrid.innerHTML=apps.map(a=>`<button class="menu-app" data-open="${esc(a.id)}"><span class="app-symbol" style="${appVars(a)}">${iconMarkup(a)}</span><span>${esc(a.name)}</span></button>`).join('');
 wireIconDrag();
}
function wireIconDrag(){
 let dragged='';
 document.querySelectorAll('.desktop-icon').forEach(el=>{
  el.addEventListener('dragstart',e=>{dragged=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>{dragged='';el.classList.remove('dragging')});
  el.addEventListener('dragover',e=>e.preventDefault());
  el.addEventListener('drop',e=>{e.preventDefault();const target=el.dataset.id;if(!dragged||dragged===target)return;const order=orderedInstalled().map(a=>a.id),from=order.indexOf(dragged),to=order.indexOf(target);order.splice(to,0,order.splice(from,1)[0]);save(KEY.order,order);renderApps(appSearch.value)});
 });
}
function installApp(id){let ids=installedIds();if(!ids.includes(id)){ids.push(id);save(KEY.installed,ids);save(KEY.order,[...load(KEY.order,[]),id]);renderApps();renderStore();showToast('App zum Home-Bildschirm hinzugefügt.')}}
function uninstallApp(id){if(BUILTINS.some(a=>a.id===id))return;save(KEY.installed,installedIds().filter(x=>x!==id));save(KEY.order,load(KEY.order,[]).filter(x=>x!==id));document.querySelector(`.window[data-id="${CSS.escape(id)}"]`)?.remove();document.querySelector(`[data-task="${CSS.escape(id)}"]`)?.remove();renderApps();renderStore();showToast('App entfernt.');}
function nativeContent(app){const div=document.createElement('div');div.className='native-app';div.dataset.native=app.type;if(app.type==='store')div.innerHTML=storeHTML();else div.innerHTML=settingsHTML();return div}
function storeHTML(){return `<div class="native-wrap"><div class="hero-card"><h1>Orbinqo Store</h1><div>Entdecke alle Programme aus deinem Orbinqo-Repository und bestimme selbst, was auf deinem Home-Bildschirm erscheint.</div></div><div class="store-tools"><input id="storeSearch" type="search" placeholder="Im Store suchen …"></div><div class="store-grid" id="storeGrid"></div></div>`}
function renderStore(){const grid=document.querySelector('#storeGrid');if(!grid)return;const q=(document.querySelector('#storeSearch')?.value||'').toLowerCase(),ids=installedIds();grid.innerHTML=catalog.filter(a=>!['store','settings'].includes(a.id)&&a.name.toLowerCase().includes(q)).map(a=>{const on=ids.includes(a.id);return `<article class="store-card"><div class="store-head"><span class="app-symbol" style="${appVars(a)}">${iconMarkup(a)}</span><div><h3>${esc(a.name)}</h3><small>Orbinqo App</small></div></div><p>${esc(a.description||'Programm aus deinem Orbinqo-Repository.')}</p><button class="primary ${on?'installed':''}" data-${on?'uninstall':'install'}="${esc(a.id)}">${on?'Entfernen':'Installieren'}</button></article>`}).join('')||'<p>Keine Apps gefunden.</p>';}
function settingsHTML(){const loc=load(KEY.location,false),wall=load(KEY.wallpaper,'default');return `<div class="native-wrap"><div class="hero-card"><h1>Einstellungen</h1><div>Passe Orbinqo an. Änderungen werden in diesem Browser gespeichert.</div></div><div class="settings-grid"><section class="setting-card"><h3>📍 Standort</h3><p>Erlaube Apps, deinen ungefähren oder genauen Standort über die Browserfreigabe zu verwenden.</p><div class="setting-actions"><button class="primary" id="locationButton">${loc?'Erlaubnis erneut prüfen':'Standort erlauben'}</button><button class="secondary" id="locationDisable">Für Orbinqo deaktivieren</button></div><p id="locationStatus">Orbinqo: ${loc?'aktiviert':'deaktiviert'}</p></section><section class="setting-card"><h3>🖼️ Hintergrund</h3><p>Wähle ein Design, eine Bild-URL oder ein eigenes Bild. Das Bild wird lokal im Browser gespeichert.</p><div class="wallpapers"><button class="wallpaper ${wall==='default'?'active':''}" data-wall="default" style="background:linear-gradient(135deg,#172554,#6d28d9)"></button><button class="wallpaper ${wall==='ocean'?'active':''}" data-wall="ocean" style="background:linear-gradient(135deg,#075985,#0f766e)"></button><button class="wallpaper ${wall==='sunset'?'active':''}" data-wall="sunset" style="background:linear-gradient(135deg,#9f1239,#f59e0b)"></button></div><input id="wallpaperUrl" type="url" placeholder="https://…/hintergrund.jpg"><div class="setting-actions"><button class="primary" id="setWallpaperUrl">URL verwenden</button><label class="secondary" style="cursor:pointer">Bild auswählen<input id="wallpaperFile" type="file" accept="image/*" hidden></label><button class="secondary" id="resetSettings">Zurücksetzen</button></div></section><section class="setting-card"><h3>ℹ️ Orbinqo</h3><p>Installierte Apps: <b>${installedIds().length}</b><br>Verfügbare Apps: <b>${catalog.length}</b></p><p>App-Auswahl, Reihenfolge und Einstellungen gelten nur für diesen Browser und dieses Gerät.</p></section></div></div>`}
function wireNative(app,win){if(app.type==='store'){renderStore();const s=win.querySelector('#storeSearch');s.oninput=renderStore}else{wireSettings(win)}}
function wireSettings(win){
 win.querySelector('#locationButton').onclick=()=>{if(!navigator.geolocation){showToast('Standort wird von diesem Browser nicht unterstützt.');return}navigator.geolocation.getCurrentPosition(()=>{save(KEY.location,true);win.querySelector('#locationStatus').textContent='Orbinqo: Standort erlaubt';showToast('Standort wurde erlaubt.')},err=>{save(KEY.location,false);win.querySelector('#locationStatus').textContent='Browserfreigabe abgelehnt';showToast(err.message)},{enableHighAccuracy:false,timeout:10000})};
 win.querySelector('#locationDisable').onclick=()=>{save(KEY.location,false);win.querySelector('#locationStatus').textContent='Orbinqo: deaktiviert';showToast('In Orbinqo deaktiviert. Die Browserberechtigung änderst du in den Website-Einstellungen.')};
 win.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>applyWallpaper(b.dataset.wall,true));
 win.querySelector('#setWallpaperUrl').onclick=()=>{const u=win.querySelector('#wallpaperUrl').value.trim();if(u)applyWallpaper(u,true)};
 win.querySelector('#wallpaperFile').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>3*1024*1024){showToast('Bitte ein Bild unter 3 MB wählen.');return}const r=new FileReader();r.onload=()=>applyWallpaper(r.result,true);r.readAsDataURL(file)};
 win.querySelector('#resetSettings').onclick=()=>{localStorage.removeItem(KEY.wallpaper);localStorage.removeItem(KEY.location);applyWallpaper('default',false);showToast('Einstellungen zurückgesetzt.');win.querySelector('.native-app').innerHTML=settingsHTML();wireSettings(win)};
}
function applyWallpaper(value,persist){if(persist)save(KEY.wallpaper,value);if(value==='default')desktop.style.background='radial-gradient(circle at 18% 18%,#4264df88,transparent 32%),radial-gradient(circle at 83% 20%,#8b3fcf77,transparent 31%),linear-gradient(145deg,#071020,#172554 48%,#171133)';else if(value==='ocean')desktop.style.background='radial-gradient(circle at 20% 20%,#0ea5e988,transparent 35%),linear-gradient(145deg,#082f49,#115e59)';else if(value==='sunset')desktop.style.background='radial-gradient(circle at 75% 20%,#fbbf2488,transparent 35%),linear-gradient(145deg,#4c0519,#9f1239 45%,#c2410c)';else desktop.style.background=`linear-gradient(#07102055,#07102055),url("${String(value).replace(/"/g,'%22')}") center/cover no-repeat`;document.querySelectorAll('.wallpaper').forEach(b=>b.classList.toggle('active',b.dataset.wall===value))}
function openApp(id){const app=appById(id);if(!app)return;let win=document.querySelector(`.window[data-id="${CSS.escape(id)}"]`);if(!win){win=document.createElement('section');win.className='window';win.dataset.id=id;win.innerHTML=`<header class="titlebar"><span class="title-icon" style="${appVars(app)}">${iconMarkup(app)}</span><span class="title-text">${esc(app.name)}</span><div class="win-controls"><button class="win-btn minimize">—</button><button class="win-btn maximize">□</button><button class="win-btn close">×</button></div></header>`;let content;if(app.type==='store'||app.type==='settings')content=nativeContent(app);else{content=document.createElement('iframe');content.className='app-frame';content.title=app.name;content.src=app.file}win.appendChild(content);windows.appendChild(win);wireWindow(win,app);addTaskButton(app);if(app.type)wireNative(app,win);requestAnimationFrame(()=>win.classList.add('visible'))}else win.classList.remove('minimized');focusWindow(win);startMenu.classList.remove('open')}
function addTaskButton(app){const b=document.createElement('button');b.className='task-btn running-app';b.dataset.task=app.id;b.title=app.name;b.innerHTML=iconMarkup(app);b.onclick=()=>{const w=document.querySelector(`.window[data-id="${CSS.escape(app.id)}"]`);if(w.classList.contains('minimized')){w.classList.remove('minimized');focusWindow(w)}else if(+w.style.zIndex===topZ){w.classList.add('minimized');b.classList.remove('active')}else focusWindow(w)};runningApps.appendChild(b)}
function focusWindow(win){topZ++;win.style.zIndex=topZ;document.querySelectorAll('.running-app').forEach(b=>b.classList.toggle('active',b.dataset.task===win.dataset.id))}
function wireWindow(win,app){const bar=win.querySelector('.titlebar');win.onpointerdown=()=>focusWindow(win);win.querySelector('.close').onclick=()=>{win.remove();document.querySelector(`[data-task="${CSS.escape(app.id)}"]`)?.remove()};win.querySelector('.minimize').onclick=()=>{win.classList.add('minimized');document.querySelector(`[data-task="${CSS.escape(app.id)}"]`)?.classList.remove('active')};win.querySelector('.maximize').onclick=()=>win.classList.toggle('maximized');bar.ondblclick=()=>win.classList.toggle('maximized');let drag=false,sx=0,sy=0,ox=0,oy=0;bar.onpointerdown=e=>{if(e.target.closest('button')||win.classList.contains('maximized')||innerWidth<701)return;drag=true;const r=win.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;win.style.transform='none';win.style.left=ox+'px';win.style.top=oy+'px';bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,ox+e.clientX-sx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-85,oy+e.clientY-sy))+'px'};bar.onpointerup=()=>drag=false}
async function loadCatalog(){try{const r=await fetch(TREE_API,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error(r.status);const {tree=[]}=await r.json(),files=tree.filter(x=>x.type==='blob').map(x=>x.path),groups=new Map();const mainIconPath=files.find(p=>/^mainIcon\/[^/]+\.jpe?g$/i.test(p));if(mainIconPath){mainIcon=BASE+encodePath(mainIconPath);const logo=$('#mainLogo');logo.src=mainIcon;logo.style.display='block';startButton.innerHTML=`<img src="${mainIcon}" alt="">`}for(const path of files){const parts=path.split('/');if(parts.length<2)continue;const root=parts[0];if(root.startsWith('.')||['mainicon','assets','css','js','img','images'].includes(root.toLowerCase()))continue;if(!groups.has(root))groups.set(root,{html:[],icons:[]});const rel=parts.slice(1),ext=(parts.at(-1).split('.').pop()||'').toLowerCase();if(rel.length===1&&['html','htm'].includes(ext))groups.get(root).html.push(path);if(rel.length===2&&rel[0].toLowerCase()==='icon'&&['jpg','jpeg'].includes(ext))groups.get(root).icons.push(path)}const colors=[['#06b6d4','#2563eb'],['#f59e0b','#ef4444'],['#10b981','#059669'],['#ec4899','#8b5cf6'],['#64748b','#334155']];let i=0;for(const [name,data] of [...groups].sort((a,b)=>a[0].localeCompare(b[0],'de'))){if(!data.html.length)continue;const html=data.html.find(p=>/(^|\/)index\.html?$/i.test(p))||data.html.sort()[0],icon=data.icons.sort()[0]||'',color=colors[i%colors.length];catalog.push({id:'repo-'+name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),name,file:BASE+encodePath(html),iconUrl:icon?BASE+encodePath(icon):'',icon:'◻',color1:color[0],color2:color[1],description:`${name} für Orbinqo`});i++}const ids=new Set(catalog.map(a=>a.id));save(KEY.installed,installedIds().filter(id=>ids.has(id)));renderApps();appStatus.textContent=`${catalog.length-2} Apps im Store`}catch(e){console.error(e);appStatus.textContent='Laden fehlgeschlagen';showToast('Apps konnten nicht von GitHub geladen werden.')}}
document.addEventListener('click',e=>{const opener=e.target.closest('[data-open]');if(opener)openApp(opener.dataset.open);const install=e.target.closest('[data-install]');if(install)installApp(install.dataset.install);const uninstall=e.target.closest('[data-uninstall]');if(uninstall)uninstallApp(uninstall.dataset.uninstall);if(!e.target.closest('.start-menu')&&!e.target.closest('#startButton'))startMenu.classList.remove('open')});startButton.onclick=()=>{startMenu.classList.toggle('open');if(startMenu.classList.contains('open'))setTimeout(()=>appSearch.focus(),80)};appSearch.oninput=()=>renderApps(appSearch.value);document.addEventListener('keydown',e=>{if(e.key==='Escape')startMenu.classList.remove('open')});function clock(){const d=new Date();$('#heroTime').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('#trayTime').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('#heroDate').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});$('#trayDate').textContent=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}applyWallpaper(load(KEY.wallpaper,'default'),false);renderApps();clock();setInterval(clock,1000);loadCatalog();
</script>
